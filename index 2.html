<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161b">
<title>Hostel Washing Machine</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7785;--free:#1f9d55;--busy:#d64545;--done:#e0a100;--bd:#dde3ea}
@media (prefers-color-scheme:dark){:root{--bg:#12161b;--card:#1c232b;--tx:#eef2f6;--mut:#93a0ae;--bd:#2c3641}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:20px 16px 50px}
h1{font-size:18px;margin:0 0 14px;color:var(--mut);font-weight:600}
h2{font-size:15px;margin:26px 0 10px;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;text-align:center;transition:border-color .4s}
.card.busy{border-color:var(--busy)}.card.free{border-color:var(--free)}.card.done{border-color:var(--done)}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:8px}
.busy .dot,.done .dot{animation:p 1.4s infinite}
@keyframes p{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}
.st{font-size:30px;font-weight:700;margin:6px 0}
.sub{color:var(--mut);font-size:15px;margin:4px 0}
.big{font-size:46px;font-weight:700;margin:10px 0;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--busy);border-radius:8px;transition:width 1s linear}
button,select,input{font:inherit;border-radius:12px;border:1px solid var(--bd);padding:13px;background:var(--card);color:var(--tx);width:100%;margin-top:10px}
button{background:var(--tx);color:var(--bg);font-weight:600;border:0;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.97)}
button.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.chip{width:auto;margin:0;padding:7px 14px;border-radius:20px;font-size:14px;background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:500}
.chip.on{background:var(--tx);color:var(--bg)}
.msg{color:var(--mut);font-size:13px;margin-top:14px;text-align:center}
.h{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.h b{display:block}.h span{color:var(--mut);font-size:13px}.h .r{text-align:right;white-space:nowrap}
.top{font-size:13px;color:var(--mut);font-weight:400}
</style></head><body><main>
<h1>🧺 Hostel Washing Machine</h1>
<div class="card" id="card"><div class="sub">Loading…</div></div>
<div id="ctl"></div>
<div class="msg" id="msg"></div>
<h2>📜 Usage history <span class="top" id="top"></span></h2>
<div id="hist"><div class="sub">No history yet.</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue,set,update,push,query,limitToLast} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDuxMjDN4gF5mpoDLmc8NAZML_Y0Ljdfnk",
  authDomain: "washing-machine-31904.firebaseapp.com",
  databaseURL: "https://washing-machine-31904-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "washing-machine-31904",
  storageBucket: "washing-machine-31904.firebasestorage.app",
  messagingSenderId: "810454342474",
  appId: "1:810454342474:web:4cb039c7f0b0ecd68cbfb3"
};

const $=id=>document.getElementById(id);
const getName=()=>{try{return localStorage.getItem('wm_name')||''}catch(e){return''}};
const setName=n=>{try{localStorage.setItem('wm_name',n)}catch(e){}};
const fmt=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+':'+String(s).padStart(2,'0')};
const clock=t=>new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const dayLabel=t=>{const d=new Date(t),n=new Date();const same=(a,b)=>a.toDateString()===b.toDateString();
  const y=new Date(n);y.setDate(n.getDate()-1);
  return same(d,n)?'Today':same(d,y)?'Yesterday':d.toLocaleDateString([], {day:'numeric',month:'short'})};
const mins=m=>m>=60?(m/60)+' hr'+(m%60?' '+(m%60)+' min':''):m+' min';

const db=getDatabase(initializeApp(firebaseConfig));
const sRef=ref(db,'washer/state'), hRef=ref(db,'washer/history');
let state={status:'free'}, hist=[], lastMode='free', picked='';

function mode(){const s=state||{};return s.status==='busy'?(Date.now()>=s.endsAt?'done':'busy'):'free'}

function view(){
  const now=Date.now(),s=state||{status:'free'},md=mode(),c=$('card');
  c.className='card '+md;
  if(md==='free') c.innerHTML='<div class="st" style="color:var(--free)"><span class="dot" style="background:var(--free)"></span>Free</div><div class="sub">Nobody is using it. Go ahead!</div>';
  if(md==='busy'){
    const pct=Math.min(100,(now-s.startedAt)/(s.endsAt-s.startedAt)*100);
    c.innerHTML='<div class="st" style="color:var(--busy)"><span class="dot" style="background:var(--busy)"></span>In use</div><div class="big">'+fmt(s.endsAt-now)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="sub">by <b></b> · started '+clock(s.startedAt)+' · ends ~'+clock(s.endsAt)+'</div>';
  }
  if(md==='done') c.innerHTML='<div class="st" style="color:var(--done)"><span class="dot" style="background:var(--done)"></span>Cycle finished</div><div class="sub"><b></b>’s clothes are waiting to be taken out</div><div class="sub">Finished at '+clock(s.endsAt)+'</div>';
  const b=c.querySelector('b'); if(b) b.textContent=s.by||'Someone';
  document.title=md==='busy'?fmt(s.endsAt-now)+' · Washer':md==='done'?'✅ Finished · Washer':'Free · Washer';
  if(md==='done'&&lastMode==='busy'&&navigator.vibrate) navigator.vibrate([300,100,300]);
  lastMode=md;
  const ctl=$('ctl');
  if(ctl.dataset.mode!==md){
    ctl.dataset.mode=md;
    if(md==='free'){
      ctl.innerHTML='<div class="chips" id="chips"></div><input id="nm" placeholder="Your name" maxlength="20"><select id="dur"><option value="30">30 min</option><option value="45">45 min</option><option value="60" selected>60 min</option><option value="90">90 min</option><option value="120">120 min</option></select><button id="go">Start my wash</button>';
      $('nm').value=getName(); $('go').onclick=start; chips();
    } else {
      ctl.innerHTML=(md==='busy'?'<button class="alt" id="ext">+15 min (need more time)</button>':'')+'<button id="free">'+(md==='done'?'I took my clothes out — mark free':'Finished early — mark free')+'</button>';
      if(md==='busy') $('ext').onclick=extend;
      $('free').onclick=release;
    }
  }
}
function chips(){
  const el=$('chips'); if(!el) return;
  const names=[...new Set(hist.slice().reverse().map(h=>h.by))].slice(0,6);
  el.innerHTML='';
  names.forEach(n=>{const b=document.createElement('button');b.className='chip'+(n===$('nm').value?' on':'');b.textContent=n;
    b.onclick=()=>{$('nm').value=n;chips()};el.appendChild(b)});
}
function renderHist(){
  const box=$('hist'); box.innerHTML='';
  if(!hist.length){box.innerHTML='<div class="sub">No history yet.</div>';$('top').textContent='';return}
  hist.slice().reverse().forEach(h=>{
    const d=document.createElement('div');d.className='h';
    const l=document.createElement('div');const nb=document.createElement('b');nb.textContent=h.by;
    const sp=document.createElement('span');sp.textContent=dayLabel(h.startedAt)+', '+clock(h.startedAt)+' · '+mins(h.minutes);
    l.append(nb,sp);
    const r=document.createElement('div');r.className='r';const rs=document.createElement('span');
    rs.textContent=h.releasedAt?'Done '+clock(h.releasedAt):(h.endsAt>Date.now()?'Running…':'Finished');
    r.appendChild(rs);d.append(l,r);box.appendChild(d);
  });
  const cnt={};hist.forEach(h=>cnt[h.by]=(cnt[h.by]||0)+1);
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  $('top').textContent='🏆 Most washes: '+top[0]+' ('+top[1]+')';
}
async function start(){
  const n=$('nm').value.trim(); if(!n){$('msg').textContent='Please enter your name.';return}
  setName(n); const d=+$('dur').value; $('go').disabled=true;
  const startedAt=Date.now(), endsAt=startedAt+d*60000;
  try{
    const hr=push(hRef);
    await set(hr,{by:n,startedAt,endsAt,minutes:d});
    await set(sRef,{status:'busy',by:n,startedAt,endsAt,hid:hr.key});
    $('msg').textContent='';
  }catch(e){$('msg').textContent='Could not save: '+e.message;$('go').disabled=false}
}
async function extend(){
  $('ext').disabled=true;
  try{
    const endsAt=state.endsAt+15*60000, minutes=Math.round((endsAt-state.startedAt)/60000);
    await update(sRef,{endsAt});
    if(state.hid) await update(ref(db,'washer/history/'+state.hid),{endsAt,minutes});
    $('ctl').dataset.mode='';view();
  }catch(e){$('msg').textContent='Could not save: '+e.message}
}
async function release(){
  $('free').disabled=true;
  try{
    if(state.hid) await update(ref(db,'washer/history/'+state.hid),{releasedAt:Date.now()});
    await set(sRef,{status:'free'});$('msg').textContent='';
  }catch(e){$('msg').textContent='Could not save: '+e.message;$('free').disabled=false}
}
onValue(sRef,snap=>{state=snap.val()||{status:'free'};$('ctl').dataset.mode='';view()},
  e=>{$('msg').textContent='Connection problem: '+e.message});
onValue(query(hRef,limitToLast(30)),snap=>{
  hist=[];snap.forEach(c=>{hist.push({id:c.key,...c.val()})});renderHist();chips()});
setInterval(()=>{if(mode()!=='free'||state.status==='busy')view()},1000);
view();
</script></main></body></html>
