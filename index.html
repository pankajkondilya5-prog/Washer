<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161b">
<title>Hostel Washing Machine</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7785;--free:#1f9d55;--busy:#d64545;--done:#e0a100;--bd:#dde3ea}
@media (prefers-color-scheme:dark){:root{--bg:#12161b;--card:#1c232b;--tx:#eef2f6;--mut:#93a0ae;--bd:#2c3641}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:20px 16px 40px}
h1{font-size:18px;margin:0 0 14px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;text-align:center}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:8px}
.st{font-size:30px;font-weight:700;margin:6px 0}
.sub{color:var(--mut);font-size:15px;margin:4px 0}
.big{font-size:44px;font-weight:700;margin:10px 0;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;border-radius:12px;border:1px solid var(--bd);padding:13px;background:var(--card);color:var(--tx);width:100%;box-sizing:border-box;margin-top:10px}
button{background:var(--tx);color:var(--bg);font-weight:600;border:0;cursor:pointer}
button:disabled{opacity:.5}
.msg{color:var(--mut);font-size:13px;margin-top:14px;text-align:center}
</style></head><body><main>
<h1>🧺 Hostel Washing Machine</h1>
<div class="card" id="card"><div class="sub">Loading…</div></div>
<div id="ctl"></div>
<div class="msg" id="msg"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue,set} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ====== PASTE YOUR FIREBASE CONFIG HERE (see setup steps) ======
const firebaseConfig = {
  apiKey: "AIzaSyDuxMjDN4gF5mpoDLmc8NAZML_Y0Ljdfnk",
  authDomain: "washing-machine-31904.firebaseapp.com",
  databaseURL: "https://washing-machine-31904-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "washing-machine-31904",
  storageBucket: "washing-machine-31904.firebasestorage.app",
  messagingSenderId: "810454342474",
  appId: "1:810454342474:web:4cb039c7f0b0ecd68cbfb3"
};
// ================================================================

const $=id=>document.getElementById(id);
const getName=()=>{try{return localStorage.getItem('wm_name')||''}catch(e){return''}};
const setName=n=>{try{localStorage.setItem('wm_name',n)}catch(e){}};
const fmt=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+':'+String(s).padStart(2,'0')};
const clock=t=>new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
let state={status:'free'};

if(firebaseConfig.apiKey==="PASTE_HERE"){
  $('card').innerHTML='<div class="sub">Firebase is not set up yet. Paste your config into index.html.</div>';
  throw new Error('no config');
}
const db=getDatabase(initializeApp(firebaseConfig));
const r=ref(db,'washer');

function view(){
  const now=Date.now(),s=state||{status:'free'};
  let mode='free';
  if(s.status==='busy') mode=now>=s.endsAt?'done':'busy';
  const c=$('card');
  if(mode==='free') c.innerHTML='<div class="st" style="color:var(--free)"><span class="dot" style="background:var(--free)"></span>Free</div><div class="sub">Nobody is using it. Go ahead!</div>';
  if(mode==='busy') c.innerHTML='<div class="st" style="color:var(--busy)"><span class="dot" style="background:var(--busy)"></span>In use</div><div class="big">'+fmt(s.endsAt-now)+'</div><div class="sub">by <b></b> · started '+clock(s.startedAt)+' · ends ~'+clock(s.endsAt)+'</div>';
  if(mode==='done') c.innerHTML='<div class="st" style="color:var(--done)"><span class="dot" style="background:var(--done)"></span>Cycle finished</div><div class="sub"><b></b>’s clothes are waiting to be taken out</div><div class="sub">Finished at '+clock(s.endsAt)+'</div>';
  const b=c.querySelector('b'); if(b) b.textContent=s.by||'Someone';
  const ctl=$('ctl');
  if(ctl.dataset.mode!==mode){
    ctl.dataset.mode=mode;
    if(mode==='free'){
      ctl.innerHTML='<input id="nm" placeholder="Your name" maxlength="20"><select id="dur"><option value="30">30 min</option><option value="45">45 min</option><option value="60" selected>60 min</option><option value="90">90 min</option></select><button id="go">Start my wash</button>';
      $('nm').value=getName(); $('go').onclick=start;
    } else {
      ctl.innerHTML='<button id="free">'+(mode==='done'?'I took my clothes out — mark free':'Finished / stop — mark free')+'</button>';
      $('free').onclick=release;
    }
  }
}
async function start(){
  const n=$('nm').value.trim(); if(!n){$('msg').textContent='Please enter your name.';return}
  setName(n); const d=+$('dur').value; $('go').disabled=true;
  try{await set(r,{status:'busy',by:n,startedAt:Date.now(),endsAt:Date.now()+d*60000});$('msg').textContent=''}
  catch(e){$('msg').textContent='Could not save: '+e.message;$('go').disabled=false}
}
async function release(){
  $('free').disabled=true;
  try{await set(r,{status:'free'});$('msg').textContent=''}
  catch(e){$('msg').textContent='Could not save: '+e.message;$('free').disabled=false}
}
onValue(r,snap=>{state=snap.val()||{status:'free'};$('ctl').dataset.mode='';view()},
  e=>{$('msg').textContent='Connection problem: '+e.message});
setInterval(()=>{if(state&&state.status==='busy')view()},1000);
view();
</script></main></body></html>
